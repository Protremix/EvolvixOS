<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvolvixOS — Forgot Password</title>
<style>
:root {
    --bg: #0a0a0c; --card: #141418; --border: rgba(255,255,255,0.08);
    --text: #f0f0f5; --muted: #8e8e93; --primary: #8b5cf6;
    --primary-glow: rgba(139,92,246,0.15); --accent: #d946ef;
    --success: #4ade80; --danger: #f87171;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-container { width: 100%; max-width: 440px; }
.auth-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 40px 32px; position: relative; overflow: hidden; }
.auth-card::before { content: ''; position: absolute; top: -2px; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--primary), var(--accent)); }
.auth-logo { text-align: center; margin-bottom: 28px; }
.auth-logo h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.auth-logo span { background: linear-gradient(90deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.auth-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
.auth-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
.form-group input { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 15px; font-family: var(--font); transition: all 0.2s; }
.form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
.form-group input::placeholder { color: var(--muted); }
.btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--accent)); border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: var(--font); }
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px var(--primary-glow); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-secondary { background: rgba(255,255,255,0.05); border: 1px solid var(--border); margin-top: 12px; }
.btn-secondary:hover { background: rgba(255,255,255,0.08); box-shadow: none; }
.alert { padding: 12px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 20px; display: none; }
.alert.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: var(--danger); display: block; }
.alert.success { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.2); color: var(--success); display: block; }
.auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted); }
.auth-footer a { color: var(--primary); text-decoration: none; }
.auth-footer a:hover { text-decoration: underline; }
.hidden { display: none !important; }
.otp-grid { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
.otp-input { width: 56px; height: 64px; text-align: center; font-size: 24px; font-weight: 700; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: var(--font); }
.otp-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
</style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo"><h1><span>Evolvix</span>OS</h1></div>
        
        <!-- Step 1: Email -->
        <div id="step-email">
            <div class="auth-title">Forgot Password</div>
            <div class="auth-subtitle">Enter your email and we'll send you a reset code.</div>
            <div id="alert1" class="alert"></div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
            </div>
            <button class="btn" id="sendBtn" onclick="sendResetCode()">Send Reset Code</button>
            <button class="btn btn-secondary" onclick="window.location.href='/login'">Back to Login</button>
        </div>
        
        <!-- Step 2: Reset Code + New Password -->
        <div id="step-reset" class="hidden">
            <div class="auth-title">Reset Password</div>
            <div class="auth-subtitle">Enter the 6-digit code sent to your email and your new password.</div>
            <div id="alert2" class="alert"></div>
            <div class="form-group">
                <label>Reset Code</label>
                <input type="text" id="otp" placeholder="123456" maxlength="6" style="text-align:center;font-size:20px;letter-spacing:4px;" inputmode="numeric" pattern="[0-9]*">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter new password" autocomplete="new-password">
            </div>
            <button class="btn" id="resetBtn" onclick="resetPassword()">Reset Password</button>
            <button class="btn btn-secondary" onclick="resendCode()">Resend Code</button>
        </div>
        
        <!-- Step 3: Success -->
        <div id="step-success" class="hidden">
            <div class="auth-title">Password Reset! 🎉</div>
            <div class="auth-subtitle">Your password has been changed successfully.</div>
            <button class="btn" onclick="window.location.href='/login'">Go to Login</button>
        </div>
    </div>
    <div class="auth-footer">© 2026 EvolvixOS — AI Engineering Platform</div>
</div>

<script>
let userEmail = '';

function showAlert(alertId, msg, type) {
    const el = document.getElementById(alertId);
    el.textContent = msg;
    el.className = 'alert ' + type;
}

async function sendResetCode() {
    const email = document.getElementById('email').value.trim();
    if (!email) { showAlert('alert1', 'Please enter your email', 'error'); return; }
    
    const btn = document.getElementById('sendBtn');
    btn.disabled = true; btn.textContent = 'Sending...';
    
    try {
        const resp = await fetch('/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await resp.json();
        
        if (resp.ok) {
            userEmail = email;
            document.getElementById('step-email').classList.add('hidden');
            document.getElementById('step-reset').classList.remove('hidden');
            showAlert('alert2', 'Reset code sent! Check your email.', 'success');
        } else {
            showAlert('alert1', data.error || 'Something went wrong', 'error');
        }
    } catch (e) {
        showAlert('alert1', 'Network error. Please try again.', 'error');
    }
    btn.disabled = false; btn.textContent = 'Send Reset Code';
}

async function resetPassword() {
    const otp = document.getElementById('otp').value.trim();
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    
    if (!otp || otp.length !== 6) { showAlert('alert2', 'Enter the 6-digit code', 'error'); return; }
    if (newPass.length < 8) { showAlert('alert2', 'Password must be at least 8 characters', 'error'); return; }
    if (newPass !== confirmPass) { showAlert('alert2', 'Passwords do not match', 'error'); return; }
    
    const btn = document.getElementById('resetBtn');
    btn.disabled = true; btn.textContent = 'Resetting...';
    
    try {
        const resp = await fetch('/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: userEmail, otp, new_password: newPass })
        });
        const data = await resp.json();
        
        if (resp.ok) {
            document.getElementById('step-reset').classList.add('hidden');
            document.getElementById('step-success').classList.remove('hidden');
        } else {
            showAlert('alert2', data.error || 'Reset failed', 'error');
        }
    } catch (e) {
        showAlert('alert2', 'Network error. Please try again.', 'error');
    }
    btn.disabled = false; btn.textContent = 'Reset Password';
}

async function resendCode() {
    if (!userEmail) return;
    try {
        await fetch('/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: userEmail })
        });
        showAlert('alert2', 'New code sent!', 'success');
    } catch (e) {
        showAlert('alert2', 'Failed to resend', 'error');
    }
}

document.getElementById('email').addEventListener('keypress', e => { if (e.key === 'Enter') sendResetCode(); });
document.getElementById('confirmPassword').addEventListener('keypress', e => { if (e.key === 'Enter') resetPassword(); });
</script>
</body>
</html>
