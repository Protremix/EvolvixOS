<!DOCTYPE html><html><head><meta charset=utf-8><title>Fetch Test</title></head>
<body>
<h1>Fetch Test</h1>
<div id=result>Testing...</div>
<script>
document.getElementById('result').innerHTML = 'Script running...';
fetch('/api/health').then(function(r){return r.json()}).then(function(d){
  document.getElementById('result').innerHTML = 'Health: ' + d.status + ' | Ollama: ' + d.ollama + ' | Models: ' + d.models_registered;
}).catch(function(e){
  document.getElementById('result').innerHTML = 'Error: ' + e.message;
});
fetch('/api/models').then(function(r){return r.json()}).then(function(d){
  document.getElementById('result').innerHTML += '<br>Models: ' + d.count + ' | Categories: ' + Object.keys(d.categories||{}).length;
}).catch(function(e){
  document.getElementById('result').innerHTML += '<br>Models Error: ' + e.message;
});
</script>
</body></html>
