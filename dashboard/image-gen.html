<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gen API · EvolvixOS</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#ffffff;--card:#f5f5f7;--text:#1d1d1f;--muted:#86868b;--accent:#007aff;--accent2:#5856d6;--green:#34c759;--orange:#febc2e;--border:rgba(255,255,255,.06);--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6;min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
.logo span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.back-btn{color:var(--muted);text-decoration:none;font-size:14px;padding:8px 16px;border-radius:10px;border:1px solid var(--border);transition:all .2s}
.back-btn:hover{color:var(--text);border-color:var(--accent)}
.container{max-width:800px;margin:0 auto;padding:48px 32px}
.hero{text-align:center;margin-bottom:48px}
.hero h1{font-size:36px;font-weight:700;margin-bottom:12px}
.hero h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);font-size:17px;max-width:600px;margin:0 auto}
.badge-row{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.badge{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.badge-free{background:rgba(0,184,148,.15);color:var(--green)}
.badge-oss{background:rgba(0,122,255,.15);color:var(--accent)}
.badge-no-card{background:rgba(253,203,110,.15);color:var(--orange)}
.section{margin-bottom:40px}
.section h2{font-size:22px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.models-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.model-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:all .2s}
.model-card:hover{border-color:var(--accent)}
.model-card .name{font-size:14px;font-weight:600;color:var(--accent2);font-family:monospace;margin-bottom:4px}
.model-card .desc{font-size:12px;color:var(--muted)}
.features-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.feature-item{display:flex;align-items:start;gap:10px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.feature-item .icon{font-size:20px;flex-shrink:0}
.feature-item .text{font-size:13px;color:var(--muted)}
.feature-item .text strong{color:var(--text)}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:16px;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.step-num{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#1d1d1f;flex-shrink:0}
.step-content h4{font-size:15px;margin-bottom:4px}
.step-content p{font-size:13px;color:var(--muted)}
.code-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;overflow-x:auto}
.code-block .lang{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.code-block pre{font-size:13px;font-family:'Fira Code',monospace;color:var(--text);white-space:pre-wrap;line-height:1.5}
.code-block pre .keyword{color:var(--accent2)}
.code-block pre .string{color:var(--green)}
.pros-cons{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pros,.cons{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.pros h4{color:var(--green);margin-bottom:8px;font-size:14px}
.cons h4{color:var(--accent2);margin-bottom:8px;font-size:14px}
.pros li,.cons li{font-size:13px;color:var(--muted);margin-bottom:6px;list-style:none;padding-left:16px;position:relative}
.pros li:before{content:'✓';position:absolute;left:0;color:var(--green)}
.cons li:before{content:'!';position:absolute;left:0;color:var(--accent2)}
.cta{text-align:center;padding:32px}
.cta a{display:inline-block;padding:14px 32px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1d1d1f;text-decoration:none;border-radius:12px;font-size:16px;font-weight:600;transition:all .2s}
.cta a:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,122,255,.3)}
.source-link{text-align:center;padding:24px;color:var(--muted);font-size:13px}
.source-link a{color:var(--accent);text-decoration:none}
.loading{text-align:center;padding:60px;color:var(--muted)}
</style>
</head>
<body>
<div class="header">
<div class="logo">⚡ <span>EvolvixOS</span></div>
<a class="back-btn" href="/studio/">← Back to Studio</a>
</div>

<div class="container" id="content">
<div class="loading">Loading...</div>
</div>

<div class="source-link">
Data from <a href="https://github.com/saurav-z/free-image-generation-api" target="_blank">saurav-z/free-image-generation-api</a> · MIT License · Auto-synced via Discovery Engine
</div>

<script>
async function load(){
  try{
    const res=await fetch('/api/image-gen');
    const data=await res.json();
    
    let html=`
    <div class="hero">
      <h1><span>${data.title}</span></h1>
      <p>${data.subtitle}</p>
      <div class="badge-row">
        <span class="badge badge-free">100K calls/day free</span>
        <span class="badge badge-oss">Open Source MIT</span>
        <span class="badge badge-no-card">No Credit Card</span>
      </div>
    </div>
    
    <div class="section">
      <h2>🎨 Available Models</h2>
      <div class="models-grid">
        ${data.models.map(m=>`<div class="model-card"><div class="name">${m}</div><div class="desc">${getModelDesc(m)}</div></div>`).join('')}
      </div>
    </div>
    
    <div class="section">
      <h2>✨ Features</h2>
      <div class="features-list">
        ${data.features.map((f,i)=>`<div class="feature-item"><div class="icon">${getIcon(i)}</div><div class="text"><strong>${f}</strong></div></div>`).join('')}
      </div>
    </div>
    
    <div class="section">
      <h2>🚀 Deployment Steps</h2>
      <div class="steps">
        ${data.deployment_steps.map(s=>`<div class="step"><div class="step-num">${s.step}</div><div class="step-content"><h4>${s.title}</h4><p>${s.desc}</p></div></div>`).join('')}
      </div>
    </div>
    
    <div class="section">
      <h2>💻 Usage Examples</h2>
      <div class="code-block"><div class="lang">cURL</div><pre>${escapeHtml(data.usage_examples.curl)}</pre></div>
      <div class="code-block"><div class="lang">Python</div><pre>${escapeHtml(data.usage_examples.python)}</pre></div>
      <div class="code-block"><div class="lang">JavaScript</div><pre>${escapeHtml(data.usage_examples.javascript)}</pre></div>
    </div>
    
    <div class="section">
      <h2>📊 Pros & Cons</h2>
      <div class="pros-cons">
        <div class="pros"><h4>Pros</h4><ul>${data.pros.map(p=>'<li>'+p+'</li>').join('')}</ul></div>
        <div class="cons"><h4>Cons</h4><ul>${data.cons.map(c=>'<li>'+c+'</li>').join('')}</ul></div>
      </div>
    </div>
    
    <div class="cta">
      <a href="${data.source}" target="_blank">View on GitHub →</a>
    </div>`;
    
    document.getElementById('content').innerHTML=html;
  }catch(e){
    document.getElementById('content').innerHTML='<div class="loading">Failed to load. '+e.message+'</div>';
  }
}

function getModelDesc(m){
  const descs={
    '@cf/stabilityai/stable-diffusion-xl-base-1.0':'Stable Diffusion XL base model - high quality general purpose',
    '@cf/bytedance/stable-diffusion-xl-lightning':'Fast SDXL variant - optimized for speed',
    '@cf/lykon/dreamshaper-8-lcm':'DreamShaper 8 with LCM - artistic styles',
    '@cf/blackforestlabs/ux-1-schnell':'FLUX Schnell - ultra-fast generation',
    '@cf/runwayml/stable-diffusion-v1-5-img2img':'Image-to-image transformation',
    '@cf/runwayml/stable-diffusion-v1-5-inpainting':'Inpainting - fill masked areas'
  };
  return descs[m]||'AI image generation model';
}

function getIcon(i){
  const icons=['🆓','⚡','🛠️','🔒','🎯','📦','🖼️','🔑','⚡','🚀'];
  return icons[i%icons.length];
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

load();
</script>
</body>
</html>
