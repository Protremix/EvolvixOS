[package]
name = "pallet-verdis-evm"
version = "0.1.0"
edition = "2021"
description = "EVM smart contract support for the Verdis blockchain"

[dependencies]
codec = { package = "parity-scale-codec", version = "3.6.1", default-features = false, features = ["derive"] }
scale-info = { version = "2.5.0", default-features = false, features = ["derive"] }
frame-support = { version = "24.0.0", default-features = false }
frame-system = { version = "24.0.0", default-features = false }
sp-core = { version = "24.0.0", default-features = false }
sp-io = { version = "26.0.0", default-features = false }
sp-runtime = { version = "27.0.0", default-features = false }
sp-std = { version = "12.0.0", default-features = false }

# Frontier EVM integration
pallet-evm = { version = "24.0.0", default-features = false, optional = true }
pallet-ethereum = { version = "21.0.0", default-features = false, optional = true }
pallet-base-fee = { version = "21.0.0", default-features = false, optional = true }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-support/std",
    "frame-system/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
    "sp-std/std",
    "pallet-evm/std",
    "pallet-ethereum/std",
    "pallet-base-fee/std",
]
runtime-benchmarks = [
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
try-runtime = ["frame-support/try-runtime"]
