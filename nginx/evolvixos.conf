# EvolvixOS Nginx Config v8.1 — Security hardened
# Added: HSTS, CSP, X-Frame-Options, X-Content-Type-Options, rate limiting

server {
    listen 80;
    listen [::]:80;
    server_name evolvixos.com www.evolvixos.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
	http2 on;
    listen [::]:443 ssl;
    server_name evolvixos.com www.evolvixos.com;

    ssl_certificate /etc/letsencrypt/live/evolvixos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evolvixos.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ─── Security Headers ───
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; media-src 'self'; object-src 'none'" always;

    # ─── Rate Limiting ───

    # Landing page
    # ─── Platform API (Base44-style) ───
    location = /platform {
        return 301 /platform/;
    }
    location = /platform/ {
        root /opt/evolvixos/web;
        try_files /platform.html =404;
    }
    location /platform/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }


    # Engineering platform landing page
    location = / {
        root /opt/evolvixos/web;
        try_files /landing.html =404;
    }
    # Old React SPA still available at /app
    location /app/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/tim/ { proxy_pass http://127.0.0.1:5010; proxy_set_header Host $host; }
    location /chat { proxy_pass http://127.0.0.1:3000/chat; proxy_set_header Host $host; }
    location /landing {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
    }

    # Old dashboard
    location /app/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # Redirect old dashboard to Base44-style platform
    location = /dashboard {
        return 302 /platform/;
    }

    # Catch-all (React frontend)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # ─── Auth API ───
    location /auth/ {
        limit_req zone=evolvixos_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:5022;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location = /login {
        alias /opt/evolvixos/dashboard/auth.html;
        default_type text/html;
    }

    location = /auth.html {
        alias /opt/evolvixos/dashboard/auth.html;
    }
    location = /forgot-password {
        alias /opt/evolvixos/dashboard/forgot-password.html;
        default_type text/html;
    }
    location = /reset-password {
        alias /opt/evolvixos/dashboard/forgot-password.html;
        default_type text/html;
    }

    location = /image-gen {
        root /opt/evolvixos/dashboard;
        try_files /image-gen.html =404;
    }
    location = /ai-tools {
        root /opt/evolvixos/dashboard;
        try_files /ai-tools.html =404;
    }
    location = /freellm {
        root /opt/evolvixos/dashboard;
        try_files /freellm.html =404;
    }
    # Chatbot template
    location = /chatbot {
        proxy_pass http://127.0.0.1:8095/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /chatbot/ {
        proxy_pass http://127.0.0.1:8095/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /learn {
        root /opt/evolvixos/dashboard;
        try_files /learn.html =404;
    }
    location /studio {
        alias /opt/evolvixos/dashboard;
        index index.html;
    }

    # Developer Portal
    location = /developer {
        alias /opt/evolvixos/dashboard/developer.html;
        default_type text/html;
    }
    location = /models {
        alias /opt/evolvixos/dashboard/models.html;
        default_type text/html;
    }
    location = /apis {
        alias /opt/evolvixos/dashboard/apis.html;
        default_type text/html;
    }
    location = /developer.html {
        alias /opt/evolvixos/dashboard/developer.html;
    }

    # API Docs (public, no auth)
    location = /api/docs {
        proxy_pass http://127.0.0.1:5010/api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API Key management
    location /auth/api-keys {
        limit_req zone=evolvixos_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:5022;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # API endpoints that need auth (tools, memories, identity, upload, etc)
    location /api/tools {
        proxy_pass http://127.0.0.1:5010/api/tools;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/memories {
        proxy_pass http://127.0.0.1:5010/api/memories;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/memory/ {
        proxy_pass http://127.0.0.1:5010/api/memory/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/identity {
        proxy_pass http://127.0.0.1:5010/api/identity;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/skills {
        proxy_pass http://127.0.0.1:5010/api/skills;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/image-gen {
        proxy_pass http://127.0.0.1:5010/api/image-gen;
        proxy_set_header Host $host;
    }
    location /api/ai-tools {
        proxy_pass http://127.0.0.1:5010/api/ai-tools;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/freellm {
        proxy_pass http://127.0.0.1:5010/api/freellm;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/learn {
        proxy_pass http://127.0.0.1:5010/api/learn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/openclaw {
        proxy_pass http://127.0.0.1:5010/api/openclaw;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/conversations {
        proxy_pass http://127.0.0.1:5010/api/conversations;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/uploads {
        proxy_pass http://127.0.0.1:5010/api/uploads;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/upload {
        proxy_pass http://127.0.0.1:5010/api/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 50m;
        proxy_read_timeout 120;
    }
    location /api/download/ {
        proxy_pass http://127.0.0.1:5010/api/download/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # ─── Model API endpoints ───
    location = /api/models {
        proxy_pass http://127.0.0.1:5010/api/models;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/models/ {
        proxy_pass http://127.0.0.1:5010/api/models/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /output/ {
        alias /opt/evolvixos/output/;
        add_header Access-Control-Allow-Origin "https://evolvixos.com";
        expires 1h;
    }

    location /api/generate/ {
        limit_req zone=evolvixos_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:5010/api/generate/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }

    location /api/job/ {
        proxy_pass http://127.0.0.1:5010/api/job/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30;
    }

    location /api/chat/stream {
        limit_req zone=evolvixos_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:5010/api/chat/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # ─── Studio API proxy rules (added v10 fix) ───
    location /api/health {
        proxy_pass http://127.0.0.1:5010/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/models {
        proxy_pass http://127.0.0.1:5010/api/models;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/agent/stream {
        limit_req zone=evolvixos_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:5010/api/agent/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
    # Auth endpoints (me, logout)
    location /auth/me {
        proxy_pass http://127.0.0.1:5022/auth/me;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location /auth/logout {
        proxy_pass http://127.0.0.1:5022/auth/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    # Catch-all for other /api/ endpoints
    # API v1 — route to Docker API (frontend container proxies to api:8000)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_send_timeout 120;
    }

    # Catch-all for other /api/ endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:5010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300;
    }

    location /api/chat {
        proxy_pass http://127.0.0.1:5010/api/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120;
    }

    location /api/agent {
        limit_req zone=evolvixos_api burst=3 nodelay;
        proxy_pass http://127.0.0.1:5010/api/agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300;
        chunked_transfer_encoding on;
    }

    location /api/templates {
        proxy_pass http://127.0.0.1:5010/api/templates;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/projects {
        proxy_pass http://127.0.0.1:5010/api/projects;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/project/ {
        proxy_pass http://127.0.0.1:5010/api/project/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:5010/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Other services ───
    location /agent/ {
        proxy_pass http://127.0.0.1:5003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300;
    }

    location /art/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180;
        proxy_send_timeout 180;
    }

    
    location /gateway/ {
        proxy_pass http://127.0.0.1:20128/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;
    }

    # FIX: Port changed from 20129 to match HF Gateway default
    location /v1/ {
        proxy_pass http://127.0.0.1:20129/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;
    }

    location /comfy/ {
        proxy_pass http://127.0.0.1:8188/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600;
        proxy_send_timeout 600;
        proxy_buffering off;
    }
}
