<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-bind="app.name">App — EvolvixOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: {
        app: { bg: '#0a0a0f', surface: '#13131a', border: '#1e1e28' },
        accent: { DEFAULT: '#7c3aed', light: '#a855f7', dark: '#5b21b6' }
      }}}
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    body { background: #0a0a0f; color: #e4e4e7; min-height: 100vh; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    .nav-tab.active { color: #c084fc; border-bottom-color: #a855f7; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: left; padding: 10px 14px; font-size: 12px; font-weight: 600; color: #71717a; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #1e1e28; white-space: nowrap; }
    .data-table td { padding: 10px 14px; font-size: 14px; border-bottom: 1px solid #1e1e28; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
    .data-table tr:hover td { background: rgba(124,58,237,0.04); }
    .form-input { background: #13131a; border: 1px solid #1e1e28; border-radius: 8px; padding: 10px 14px; color: #e4e4e7; font-size: 14px; width: 100%; outline: none; transition: border-color 0.2s; }
    .form-input:focus { border-color: #7c3aed; }
    .form-label { font-size: 13px; font-weight: 500; color: #a1a1aa; margin-bottom: 6px; display: block; }
    .btn-primary { background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; padding: 10px 20px; border-radius: 8px; font-weight: 500; font-size: 14px; border: none; cursor: pointer; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: #1e1e28; color: #e4e4e7; padding: 10px 20px; border-radius: 8px; font-weight: 500; font-size: 14px; border: none; cursor: pointer; }
    .stat-card { background: #13131a; border: 1px solid #1e1e28; border-radius: 12px; padding: 20px; }
    .chart-bar { background: linear-gradient(to top, #7c3aed, #a855f7); border-radius: 4px 4px 0 0; transition: height 0.5s; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: #13131a; border: 1px solid #1e1e28; border-radius: 16px; padding: 24px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
    .badge-success { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-warning { background: rgba(234,179,8,0.15); color: #facc15; }
    .badge-danger { background: rgba(239,68,68,0.15); color: #f87171; }
    .badge-neutral { background: rgba(161,161,170,0.15); color: #a1a1aa; }
    .rel-link { color: #a855f7; text-decoration: none; cursor: pointer; }
    .rel-link:hover { text-decoration: underline; }
    .spinner { width: 32px; height: 32px; border: 3px solid rgba(124,58,237,0.2); border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-root"></div>
  <div id="modal-root"></div>

  <script>
    var App = { data: null, entities: [], pages: [], currentPage: 0, records: {}, slug: null };
    var pathParts = window.location.pathname.split('/');
    App.slug = pathParts[2] || '';

    // === Component Renderers ===
    var Renderers = {
      header: function(comp, container) {
        var p = comp.props || comp;
        var el = document.createElement('div');
        el.className = 'mb-6';
        var title = p.title || p.text || p.content || '';
        var subtitle = p.subtitle || '';
        var size = p.size || 'text-2xl';
        el.innerHTML = '<h1 class="' + size + ' font-bold text-white">' + escapeHtml(title) + '</h1>';
        if (subtitle) el.innerHTML += '<p class="text-sm text-gray-500 mt-1">' + escapeHtml(subtitle) + '</p>';
        container.appendChild(el);
      },

      datatable: function(comp, container) {
        var p = comp.props || comp;
        var entityName = p.entity || comp.content || '';
        if (!entityName) { container.innerHTML += '<div class="text-gray-500 text-sm p-4">No entity selected</div>'; return; }
        var wrapper = document.createElement('div');
        wrapper.className = 'rounded-xl border border-app-border overflow-hidden bg-app-surface fade-in';
        wrapper.innerHTML = '<div class="p-8 text-center"><div class="spinner"></div><p class="text-gray-500 text-xs mt-3">Loading ' + escapeHtml(entityName) + '...</p></div>';
        container.appendChild(wrapper);
        fetchRecords(entityName).then(function(data) {
          renderDataTable(wrapper, entityName, data.records || []);
        }).catch(function(err) {
          wrapper.innerHTML = '<div class="p-4 text-red-400 text-sm">Error: ' + escapeHtml(err.message) + '</div>';
        });
      },

      form: function(comp, container) {
        var p = comp.props || comp;
        var entityName = p.entity || comp.content || '';
        if (!entityName) return;
        var entity = App.entities.find(function(e) { return e.name === entityName; });
        var fields = entity ? Object.keys(entity.schema.properties || {}) : [];
        var wrapper = document.createElement('div');
        wrapper.className = 'rounded-xl border border-app-border bg-app-surface p-6 fade-in';
        var html = '<h3 class="text-lg font-semibold text-white mb-4">New ' + escapeHtml(entityName) + '</h3>';
        html += '<form onsubmit="submitForm(event, \'' + entityName + '\')" class="space-y-4">';
        fields.forEach(function(field) {
          var fd = entity.schema.properties[field];
          html += '<div><label class="form-label">' + escapeHtml(capitalize(field)) + '</label>';
          if (fd.type === 'relation') {
            html += '<select name="' + field + '" class="form-input" id="rel-' + field + '"><option value="">Select ' + escapeHtml(fd.relation.target) + '...</option></select>';
            fetchRecords(fd.relation.target).then(function(d) {
              var sel = document.getElementById('rel-' + field);
              if (sel) (d.records || []).forEach(function(r) {
                var opt = document.createElement('option');
                opt.value = r.id;
                opt.textContent = r[fd.relation.display || 'name'] || '#' + r.id;
                sel.appendChild(opt);
              });
            });
          } else if (fd.type === 'boolean') {
            html += '<input type="checkbox" name="' + field + '" class="w-5 h-5 accent-purple-600">';
          } else {
            var t = (fd.type === 'integer' || fd.type === 'number') ? 'number' : 'text';
            html += '<input type="' + t + '" name="' + field + '" class="form-input" placeholder="Enter ' + escapeHtml(field) + '...">';
          }
          html += '</div>';
        });
        html += '<div class="flex gap-3 pt-2"><button type="submit" class="btn-primary">Save Record</button><button type="reset" class="btn-secondary">Reset</button></div>';
        wrapper.innerHTML = html;
        container.appendChild(wrapper);
      },

      statcard: function(comp, container) {
        var p = comp.props || comp;
        var entityName = p.entity || '';
        var field = p.field || 'count';
        var label = p.label || entityName || 'Total';
        var iconMap = { database: '📊', chart: '📈', users: '👥', money: '💰', cart: '🛒', task: '✅' };
        var icon = iconMap[p.icon] || '📊';
        var card = document.createElement('div');
        card.className = 'stat-card fade-in';
        card.innerHTML = '<div class="flex items-center justify-between mb-2"><p class="text-sm text-gray-500 font-medium">' + escapeHtml(label) + '</p><span class="text-xl">' + icon + '</span></div><p class="text-3xl font-bold text-white" id="stat-' + entityName + '-' + field + '">—</p>';
        container.appendChild(card);
        if (entityName) {
          fetchRecords(entityName).then(function(data) {
            var val = data.total || (data.records || []).length;
            if (field !== 'count' && data.records && data.records.length > 0) {
              var sum = data.records.reduce(function(a, r) { return a + (parseFloat(r[field]) || 0); }, 0);
              val = field === 'avg' ? (sum / data.records.length).toFixed(1) : sum;
            }
            var el = document.getElementById('stat-' + entityName + '-' + field);
            if (el) el.textContent = typeof val === 'number' ? val.toLocaleString() : val;
          });
        }
      },

      chart: function(comp, container) {
        var p = comp.props || comp;
        var title = p.title || 'Chart';
        var entityName = p.entity || '';
        var labelField = p.labelField || 'name';
        var valueField = p.valueField || 'count';
        var wrapper = document.createElement('div');
        wrapper.className = 'rounded-xl border border-app-border bg-app-surface p-6 fade-in';
        wrapper.innerHTML = '<h3 class="text-lg font-semibold text-white mb-4">' + escapeHtml(title) + '</h3><div id="chart-' + Math.random().toString(36).substr(2,9) + '" class="flex items-end gap-2 h-48"></div>';
        container.appendChild(wrapper);
        var canvas = wrapper.querySelector('div');
        if (entityName) {
          fetchRecords(entityName).then(function(data) {
            renderChart(canvas, data.records || [], labelField, valueField);
          });
        } else {
          // Aggregate record counts across all entities
          var counts = [];
          var pending = App.entities.length;
          if (pending === 0) { canvas.innerHTML = '<div class="text-gray-500 text-sm w-full text-center py-8">No data</div>'; return; }
          App.entities.forEach(function(e) {
            fetchRecords(e.name).then(function(d) {
              counts.push({ name: e.name, count: d.total || (d.records || []).length });
              if (--pending === 0) {
                counts.sort(function(a, b) { return b.count - a.count; });
                renderChart(canvas, counts, 'name', 'count');
              }
            });
          });
        }
      },

      grid: function(comp, container) {
        var p = comp.props || comp;
        var cols = p.columns || 2;
        var children = p.children || comp.children || [];
        var grid = document.createElement('div');
        grid.className = 'grid gap-4 mb-6';
        grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
        children.forEach(function(child) {
          var childContainer = document.createElement('div');
          grid.appendChild(childContainer);
          renderComponent(child, childContainer);
        });
        container.appendChild(grid);
      },

      button: function(comp, container) {
        var p = comp.props || comp;
        var btn = document.createElement('button');
        btn.className = 'btn-primary mb-4';
        btn.textContent = p.label || p.text || comp.content || 'Button';
        if (p.action === 'new_record' || p.action === 'create') btn.onclick = function() { openNewRecordModal(p.entity); };
        container.appendChild(btn);
      },

      text: function(comp, container) {
        var p = comp.props || comp;
        var el = document.createElement('p');
        el.className = 'text-gray-300 text-sm mb-4';
        el.textContent = p.text || p.content || '';
        container.appendChild(el);
      },

      fieldlist: function(comp, container) {
        var p = comp.props || comp;
        var entityName = p.entity || '';
        if (!entityName) return;
        var entity = App.entities.find(function(e) { return e.name === entityName; });
        if (!entity) return;
        var fields = Object.keys(entity.schema.properties || {});
        var wrapper = document.createElement('div');
        wrapper.className = 'rounded-xl border border-app-border bg-app-surface p-4 mb-4 fade-in';
        wrapper.innerHTML = '<h4 class="text-sm font-semibold text-white mb-3">' + escapeHtml(entityName) + ' Fields</h4><div class="space-y-2">';
        fields.forEach(function(f) {
          var def = entity.schema.properties[f];
          var typeIcon = def.type === 'relation' ? '🔗' : def.type === 'integer' ? '🔢' : def.type === 'boolean' ? '☑' : '📝';
          var relInfo = def.type === 'relation' ? ' → ' + escapeHtml(def.relation.target) : '';
          wrapper.innerHTML += '<div class="flex items-center gap-2 text-sm"><span>' + typeIcon + '</span><span class="text-white font-medium">' + escapeHtml(f) + '</span><span class="text-gray-500">' + escapeHtml(def.type) + relInfo + '</span></div>';
        });
        wrapper.innerHTML += '</div>';
        container.appendChild(wrapper);
      },

      image: function(comp, container) {
        var p = comp.props || comp;
        var el = document.createElement('div');
        el.className = 'mb-4';
        if (p.src) {
          el.innerHTML = '<img src="' + escapeHtml(p.src) + '" alt="' + escapeHtml(p.alt || '') + '" class="rounded-lg max-w-full">';
        } else {
          el.className = 'bg-app-surface border border-app-border rounded-lg h-48 flex items-center justify-center text-gray-500 mb-4';
          el.textContent = 'Image placeholder';
        }
        container.appendChild(el);
      },

      container: function(comp, container) {
        var p = comp.props || comp;
        var children = p.children || comp.children || [];
        var el = document.createElement('div');
        el.className = 'space-y-4 mb-4';
        children.forEach(function(child) { renderComponent(child, el); });
        container.appendChild(el);
      }
    };

    function renderComponent(comp, container) {
      var type = comp.type || comp.component || '';
      var renderer = Renderers[type];
      if (renderer) renderer(comp, container);
      else container.innerHTML += '<div class="text-gray-500 text-sm p-4">Unknown: ' + escapeHtml(type) + '</div>';
    }

    function renderChart(canvas, records, labelField, valueField) {
      canvas.innerHTML = '';
      if (!records || records.length === 0) {
        canvas.innerHTML = '<div class="text-gray-500 text-sm w-full text-center py-8">No data</div>';
        return;
      }
      var maxVal = Math.max.apply(null, records.map(function(r) { return parseFloat(r[valueField]) || 0; }).concat([1]));
      records.slice(0, 12).forEach(function(rec) {
        var val = parseFloat(rec[valueField]) || 0;
        var height = Math.max((val / maxVal) * 100, 2);
        var bar = document.createElement('div');
        bar.className = 'flex-1 flex flex-col items-center gap-1';
        bar.innerHTML = '<div class="chart-bar w-full" style="height:' + height + '%; min-height:4px;"></div><span class="text-xs text-gray-500 truncate w-full text-center">' + escapeHtml(String(rec[labelField] || '').substring(0, 10)) + '</span>';
        canvas.appendChild(bar);
      });
    }

    function renderDataTable(wrapper, entityName, records) {
      var entity = App.entities.find(function(e) { return e.name === entityName; });
      var fields = entity ? Object.keys(entity.schema.properties || {}) : [];
      if (records.length === 0) {
        wrapper.innerHTML = '<div class="p-12 text-center"><p class="text-gray-500 text-sm">No records yet</p><button class="btn-primary mt-4" onclick="openNewRecordModal(\'' + entityName + '\')">+ Add Record</button></div>';
        return;
      }
      var allFields = fields.concat(['created_date']);
      var html = '<div class="flex items-center justify-between p-4 border-b border-app-border"><h3 class="text-sm font-semibold text-white">' + escapeHtml(entityName) + ' (' + records.length + ')</h3><button class="btn-primary text-xs px-3 py-1.5" onclick="openNewRecordModal(\'' + entityName + '\')">+ Add</button></div>';
      html += '<div class="overflow-x-auto"><table class="data-table"><thead><tr>';
      allFields.forEach(function(f) { html += '<th>' + escapeHtml(capitalize(f.replace(/_/g, ' '))) + '</th>'; });
      html += '</tr></thead><tbody>';
      records.forEach(function(rec) {
        html += '<tr onclick="openRecordDetail(\'' + entityName + '\', ' + rec.id + ')" class="cursor-pointer">';
        allFields.forEach(function(f) {
          var val = rec[f];
          var fd = entity && entity.schema.properties[f];
          if (fd && fd.type === 'relation' && val) {
            var relLabel = rec['_rel_' + f + '_label'] || '#' + val;
            html += '<td><span class="rel-link" onclick="event.stopPropagation(); openRecordDetail(\'' + fd.relation.target + '\', ' + val + ')">' + escapeHtml(String(relLabel)) + '</span></td>';
          } else if (val === null || val === undefined) {
            html += '<td class="text-gray-600">—</td>';
          } else if (typeof val === 'boolean') {
            html += '<td><span class="badge ' + (val ? 'badge-success' : 'badge-neutral') + '">' + (val ? 'Yes' : 'No') + '</span></td>';
          } else {
            var str = String(val);
            if (str.length > 60) str = str.substring(0, 60) + '...';
            if (f === 'status') {
              var bc = 'badge-neutral';
              if (['active','completed','published','paid','done'].includes(str.toLowerCase())) bc = 'badge-success';
              else if (['pending','draft','processing'].includes(str.toLowerCase())) bc = 'badge-warning';
              else if (['cancelled','failed','overdue'].includes(str.toLowerCase())) bc = 'badge-danger';
              html += '<td><span class="badge ' + bc + '">' + escapeHtml(str) + '</span></td>';
            } else {
              html += '<td class="text-gray-200">' + escapeHtml(str) + '</td>';
            }
          }
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      wrapper.innerHTML = html;
    }

    // === Data Fetching ===
    async function fetchRecords(entityName) {
      if (App.records[entityName]) return App.records[entityName];
      var url = '/platform/api/apps/slug/' + App.slug + '/records/' + entityName + '?limit=100';
      try {
        var res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();
        App.records[entityName] = data;
        return data;
      } catch(e) { return { records: [], total: 0, error: e.message }; }
    }

    // === Record Actions ===
    function openNewRecordModal(entityName) {
      var entity = App.entities.find(function(e) { return e.name === entityName; });
      if (!entity) return;
      var fields = Object.keys(entity.schema.properties || {});
      var html = '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">';
      html += '<h3 class="text-lg font-bold text-white mb-4">New ' + escapeHtml(entityName) + '</h3>';
      html += '<form onsubmit="submitForm(event, \'' + entityName + '\')" class="space-y-4">';
      fields.forEach(function(field) {
        var def = entity.schema.properties[field];
        html += '<div><label class="form-label">' + escapeHtml(capitalize(field)) + '</label>';
        if (def.type === 'relation') {
          html += '<select name="' + field + '" class="form-input" id="modal-rel-' + field + '"><option value="">Select...</option></select>';
          fetchRecords(def.relation.target).then(function(d) {
            var sel = document.getElementById('modal-rel-' + field);
            if (sel) (d.records || []).forEach(function(r) {
              var opt = document.createElement('option');
              opt.value = r.id; opt.textContent = r[def.relation.display || 'name'] || '#' + r.id;
              sel.appendChild(opt);
            });
          });
        } else if (def.type === 'boolean') {
          html += '<input type="checkbox" name="' + field + '" class="w-5 h-5 accent-purple-600">';
        } else {
          var t = (def.type === 'integer' || def.type === 'number') ? 'number' : 'text';
          html += '<input type="' + t + '" name="' + field + '" class="form-input" placeholder="Enter ' + escapeHtml(field) + '...">';
        }
        html += '</div>';
      });
      html += '<div class="flex gap-3 pt-2"><button type="submit" class="btn-primary">Create</button><button type="button" onclick="closeModal()" class="btn-secondary">Cancel</button></div>';
      html += '</form></div></div>';
      document.getElementById('modal-root').innerHTML = html;
    }

    async function submitForm(event, entityName) {
      event.preventDefault();
      var formData = new FormData(event.target);
      var data = {};
      formData.forEach(function(v, k) {
        if (v !== '' && v !== 'on') data[k] = isNaN(v) ? v : parseInt(v);
        if (v === 'on') data[k] = true;
      });
      var entity = App.entities.find(function(e) { return e.name === entityName; });
      Object.keys(entity.schema.properties).forEach(function(f) {
        if (entity.schema.properties[f].type === 'boolean' && !(f in data)) data[f] = false;
      });
      try {
        var res = await fetch('/platform/api/entities/' + entityName + '/records', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: data })
        });
        if (res.ok) { App.records[entityName] = null; closeModal(); renderCurrentPage(); }
        else { var err = await res.json(); alert('Error: ' + (err.detail || 'Failed')); }
      } catch(e) { alert('Error: ' + e.message); }
    }

    function openRecordDetail(entityName, recordId) {
      var entity = App.entities.find(function(e) { return e.name === entityName; });
      if (!entity) return;
      fetchRecords(entityName).then(function(data) {
        var rec = (data.records || []).find(function(r) { return r.id === recordId; });
        if (!rec) return;
        var fields = Object.keys(entity.schema.properties || {});
        var html = '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">';
        html += '<h3 class="text-lg font-bold text-white mb-4">' + escapeHtml(entityName) + ' #' + recordId + '</h3><div class="space-y-3">';
        fields.forEach(function(f) {
          var def = entity.schema.properties[f];
          var val = rec[f];
          var displayVal = val;
          if (def.type === 'relation' && val) displayVal = (rec['_rel_' + f + '_label'] || '#' + val) + ' (→ ' + def.relation.target + ')';
          else if (val === null || val === undefined) displayVal = '—';
          else if (def.type === 'boolean') displayVal = val ? '✓ Yes' : '✗ No';
          else if (def.type === 'array' || def.type === 'object') displayVal = JSON.stringify(val, null, 2);
          html += '<div><span class="form-label">' + escapeHtml(capitalize(f)) + '</span>';
          if (def.type === 'array' || def.type === 'object') {
            html += '<pre class="bg-app-bg rounded-lg p-3 text-xs text-gray-300 overflow-x-auto">' + escapeHtml(displayVal) + '</pre>';
          } else {
            html += '<p class="text-white text-sm">' + escapeHtml(String(displayVal)) + '</p>';
          }
          html += '</div>';
        });
        html += '<div class="text-xs text-gray-500 pt-2 border-t border-app-border">Created: ' + escapeHtml(rec.created_date || '') + '</div>';
        html += '</div><div class="flex gap-3 pt-4"><button onclick="closeModal()" class="btn-secondary">Close</button></div></div></div>';
        document.getElementById('modal-root').innerHTML = html;
      });
    }

    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

    // === Page Rendering ===
    function renderCurrentPage() {
      var root = document.getElementById('app-root');
      var page = App.pages[App.currentPage];
      if (!page) return;
      App.records = {}; // Clear cache
      var html = '<header class="border-b border-app-border bg-app-surface/80 backdrop-blur sticky top-0 z-50">';
      html += '<div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">';
      html += '<div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-600 to-fuchsia-600 flex items-center justify-center text-white font-bold">' + escapeHtml((App.data.name || 'A').charAt(0)) + '</div>';
      html += '<div><h1 class="text-base font-bold text-white">' + escapeHtml(App.data.name || 'App') + '</h1>';
      html += '<p class="text-xs text-gray-500">Published app</p></div></div>';
      if (App.pages.length > 1) {
        html += '<nav class="flex gap-1 overflow-x-auto max-w-2xl">';
        App.pages.forEach(function(pg, i) {
          html += '<button onclick="switchPage(' + i + ')" class="nav-tab px-3 py-2 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-white transition ' + (i === App.currentPage ? 'active' : '') + '">' + escapeHtml(pg.name) + '</button>';
        });
        html += '</nav>';
      }
      html += '<a href="/platform/" class="text-xs text-gray-500 hover:text-white">← Back to Platform</a>';
      html += '</div></header>';
      html += '<main class="max-w-6xl mx-auto px-6 py-8"><div id="page-content"></div></main>';
      root.innerHTML = html;
      root.className = 'fade-in';

      var pageContent = document.getElementById('page-content');
      var layout = page.layout || [];
      if (typeof layout === 'string') { try { layout = JSON.parse(layout); } catch(e) { layout = []; } }
      if (layout.length === 0) {
        pageContent.innerHTML = '<div class="text-center py-20 text-gray-500"><p>This page has no components yet.</p></div>';
      } else {
        layout.forEach(function(comp) { renderComponent(comp, pageContent); });
      }
    }

    function switchPage(idx) { App.currentPage = idx; renderCurrentPage(); }

    // === Init ===
    async function init() {
      if (!App.slug) {
        document.getElementById('app-root').innerHTML = '<div class="flex items-center justify-center min-h-screen"><div class="text-center"><h1 class="text-2xl font-bold text-white mb-2">No App Specified</h1><p class="text-gray-500 mb-6">Add an app slug to the URL: /app/your-app-slug</p><a href="/platform/" class="btn-primary inline-block">Go to Platform</a></div></div>';
        return;
      }
      try {
        var res = await fetch('/platform/api/apps/slug/' + App.slug);
        if (!res.ok) { showNotFound(); return; }
        var app = await res.json();
        if (!app || app.detail) { showNotFound(); return; }
        App.data = app;
        // Get entities for this app
        var entRes = await fetch('/platform/api/apps/slug/' + App.slug + '/entities');
        if (entRes.ok) App.entities = await entRes.json() || [];
        // Get pages
        if (app.pages) {
          App.pages = app.pages;
        } else {
          var pageRes = await fetch('/platform/api/apps/' + app.id + '/pages');
          if (pageRes.ok) App.pages = await pageRes.json() || [];
        }
        if (!App.pages || App.pages.length === 0) {
          App.pages = [{ name: 'Data', slug: 'data', layout: App.entities.map(function(e) { return { component: 'datatable', props: { entity: e.name } }; })}];
        }
        renderCurrentPage();
      } catch(e) { console.error('Init error:', e); showNotFound(); }
    }

    function showNotFound() {
      document.getElementById('app-root').innerHTML = '<div class="flex items-center justify-center min-h-screen"><div class="text-center"><h1 class="text-2xl font-bold text-white mb-2">App Not Found</h1><p class="text-gray-500 mb-6">This app doesn\'t exist or hasn\'t been published.</p><a href="/platform/" class="btn-primary inline-block">Go to Platform</a></div></div>';
    }

    function escapeHtml(str) { if (str === null || str === undefined) return ''; var div = document.createElement('div'); div.textContent = String(str); return div.innerHTML; }
    function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, ' ') : ''; }

    init();
  </script>
</body>
</html>
