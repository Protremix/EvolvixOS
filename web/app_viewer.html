<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Viewer — EvolvixOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { font-family: 'Inter', system-ui, sans-serif; }
    body { background: #0a0a0f; color: #e4e4e7; }
    .entity-table { width: 100%; border-collapse: collapse; }
    .entity-table th { text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 600; color: #71717a; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .entity-table td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .entity-table tr:hover td { background: rgba(124,58,237,0.05); }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(124,58,237,0.2); border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen">
  <div id="app-root" class="min-h-screen">
    <div id="loading" class="flex items-center justify-center min-h-screen">
      <div class="text-center">
        <div class="loading-spinner mx-auto mb-4"></div>
        <p class="text-gray-500 text-sm">Loading app...</p>
      </div>
    </div>
    <div id="error" class="hidden flex items-center justify-center min-h-screen">
      <div class="text-center max-w-md">
        <div class="text-6xl mb-4">🔍</div>
        <h1 class="text-2xl font-bold text-white mb-2">App Not Found</h1>
        <p class="text-gray-500 mb-6">This app doesn't exist or hasn't been published yet.</p>
        <a href="/platform/" class="inline-block px-6 py-3 rounded-lg bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white font-medium hover:opacity-90 transition">Go to Platform</a>
      </div>
    </div>
    <div id="app-content" class="hidden">
      <header class="border-b border-white/5 bg-[#0c0c12]/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-600 to-fuchsia-600 flex items-center justify-center text-white font-bold text-lg" id="app-icon">A</div>
            <div>
              <h1 class="text-lg font-bold text-white" id="app-title">App Name</h1>
              <p class="text-xs text-gray-500" id="app-subtitle">Published app</p>
            </div>
          </div>
          <a href="/platform/" class="text-sm text-gray-400 hover:text-white transition">← Back to Platform</a>
        </div>
      </header>
      <nav id="entity-nav" class="border-b border-white/5 bg-[#0c0c12]/50">
        <div class="max-w-7xl mx-auto px-6 flex gap-1 overflow-x-auto" id="entity-nav-inner"></div>
      </nav>
      <main class="max-w-7xl mx-auto px-6 py-8">
        <div id="entity-view" class="hidden">
          <div class="flex items-center justify-between mb-6">
            <div>
              <h2 class="text-xl font-bold text-white" id="entity-title">Records</h2>
              <p class="text-sm text-gray-500" id="entity-count">0 records</p>
            </div>
            <input type="text" id="search-input" placeholder="Search..." class="px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-sm text-gray-200 outline-none focus:border-purple-500 w-48" oninput="filterRecords(this.value)" />
          </div>
          <div class="rounded-xl border border-white/5 overflow-hidden bg-white/[0.02]">
            <table class="entity-table" id="entity-table">
              <thead id="entity-thead"></thead>
              <tbody id="entity-tbody"></tbody>
            </table>
          </div>
          <div id="no-records" class="hidden text-center py-16">
            <p class="text-gray-500 text-sm">No records found.</p>
          </div>
        </div>
        <div id="empty-state" class="hidden text-center py-20">
          <div class="text-5xl mb-4">📋</div>
          <h2 class="text-xl font-semibold text-white mb-2">No Entities Yet</h2>
          <p class="text-gray-500 mb-6">This app doesn't have any entities to display.</p>
          <a href="/platform/" class="inline-block px-6 py-3 rounded-lg bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white font-medium hover:opacity-90 transition">Open Page Builder</a>
        </div>
      </main>
    </div>
  </div>
  <script>
    var currentApp = null, currentEntities = [], currentEntityIdx = 0, allRecords = [];
    var pathParts = window.location.pathname.split('/');
    var slug = pathParts[2] || '';

    async function init() {
      if (!slug) { showError(); return; }
      try {
        var res = await fetch('/platform/api/apps/slug/' + slug);
        if (!res.ok) { showError(); return; }
        var app = await res.json();
        if (!app || app.detail) { showError(); return; }
        currentApp = app;

        var entitiesRes = await fetch('/platform/api/apps/slug/' + slug + '/entities');
        if (entitiesRes.ok) {
          var entitiesData = await entitiesRes.json();
          currentEntities = Array.isArray(entitiesData) ? entitiesData : (entitiesData.entities || []);
        } else { currentEntities = []; }
        renderApp();
      } catch(e) { console.error('Init error:', e); showError(); }
    }

    function showError() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
    }

    function renderApp() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('app-content').classList.remove('hidden');
      document.getElementById('app-content').classList.add('fade-in');
      document.getElementById('app-title').textContent = currentApp.name;
      document.getElementById('app-icon').textContent = currentApp.name.charAt(0).toUpperCase();
      if (currentApp.description) document.getElementById('app-subtitle').textContent = currentApp.description;

      var nav = document.getElementById('entity-nav-inner');
      nav.innerHTML = '';
      if (!currentEntities || currentEntities.length === 0) {
        document.getElementById('empty-state').classList.remove('hidden');
        return;
      }
      currentEntities.forEach(function(entity, idx) {
        var btn = document.createElement('button');
        btn.className = 'px-4 py-3 text-sm font-medium border-b-2 transition whitespace-nowrap ' +
          (idx === 0 ? 'border-purple-500 text-white' : 'border-transparent text-gray-400 hover:text-white');
        btn.textContent = entity.name;
        btn.onclick = function() { selectEntity(idx); };
        nav.appendChild(btn);
      });
      selectEntity(0);
    }

    async function selectEntity(idx) {
      currentEntityIdx = idx;
      var entity = currentEntities[idx];
      var navBtns = document.querySelectorAll('#entity-nav-inner button');
      navBtns.forEach(function(btn, i) {
        btn.className = i === idx
          ? 'px-4 py-3 text-sm font-medium border-b-2 border-purple-500 text-white transition whitespace-nowrap'
          : 'px-4 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-white transition whitespace-nowrap';
      });
      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('entity-view').classList.remove('hidden');
      document.getElementById('entity-title').textContent = entity.name + ' Records';
      try {
        var res = await fetch('/platform/api/apps/slug/' + slug + '/records/' + entity.name + '?limit=100');
        if (res.ok) {
          var data = await res.json();
          allRecords = Array.isArray(data) ? data : (data.records || []);
        } else {
          allRecords = [];
        }
      } catch(e) { allRecords = []; }
      renderRecords(entity);
    }

    function renderRecords(entity) {
      var schema = entity.schema || {};
      var fields = Object.keys(schema.properties || {});
      var allFields = fields.concat(['created_date', 'updated_date']);
      var thead = document.getElementById('entity-thead');
      thead.innerHTML = '<tr>' + allFields.map(function(f) {
        return '<th>' + f.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); }) + '</th>';
      }).join('') + '</tr>';
      var tbody = document.getElementById('entity-tbody');
      var noRecs = document.getElementById('no-records');
      noRecs.classList.toggle('hidden', allRecords.length > 0);
      document.getElementById('entity-table').style.display = allRecords.length > 0 ? '' : 'none';
      if (allRecords.length === 0) {
        tbody.innerHTML = '';
        document.getElementById('entity-count').textContent = '0 records';
        return;
      }
      document.getElementById('entity-count').textContent = allRecords.length + ' record' + (allRecords.length !== 1 ? 's' : '');
      tbody.innerHTML = allRecords.map(function(record) {
        var data = record.data || record;
        return '<tr>' + allFields.map(function(f) {
          var val = data[f];
          if (val === null || val === undefined) return '<td class="text-gray-600">—</td>';
          if (typeof val === 'object') return '<td class="text-gray-400">' + escapeHtml(JSON.stringify(val).substring(0, 50)) + '...</td>';
          if (typeof val === 'boolean') return '<td>' + (val ? '✓' : '✗') + '</td>';
          var str = String(val);
          if (str.length > 80) str = str.substring(0, 80) + '...';
          return '<td class="text-gray-200">' + escapeHtml(str) + '</td>';
        }).join('') + '</tr>';
      }).join('');
    }

    function filterRecords(query) {
      if (!query) { renderRecords(currentEntities[currentEntityIdx]); return; }
      var filtered = allRecords.filter(function(r) {
        var data = r.data || r;
        return Object.values(data).some(function(v) { return String(v).toLowerCase().includes(query.toLowerCase()); });
      });
      var tempAll = allRecords;
      allRecords = filtered;
      renderRecords(currentEntities[currentEntityIdx]);
      allRecords = tempAll;
    }

    function escapeHtml(str) { var div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
    init();
  </script>
</body>
</html>
