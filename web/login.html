<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvolvixOS — Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif}
body{margin:0;background:#f5f5f7;color:#1d1d1f;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.btn-primary{background:#007AFF;color:#fff;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;border:none;cursor:pointer;width:100%;transition:all .2s}
.btn-primary:hover{background:#0051A8}
.btn-primary:disabled{opacity:.5;cursor:wait}
.input{width:100%;padding:12px 14px;border:1px solid rgba(0,0,0,.1);border-radius:10px;font-size:14px;outline:none;transition:border .2s}
.input:focus{border-color:#007AFF}
.logo{width:44px;height:44px;background:linear-gradient(135deg,#007AFF,#5856D6);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;margin:0 auto 16px}
.error-msg{color:#ff3b30;font-size:13px;margin-top:8px;display:none}
.otp-section{display:none}
</style>
</head>
<body>
<div class="login-card">
<div class="logo">E</div>
<h1 class="text-2xl font-bold text-center mb-1">Welcome to EvolvixOS</h1>
<p class="text-sm text-gray-500 text-center mb-6">Sign in to your engineering platform</p>

<div id="error-msg" class="error-msg"></div>

<form id="login-form" onsubmit="return doLogin(event)">
<input type="email" id="email" class="input mb-3" placeholder="Email" required>
<input type="password" id="password" class="input mb-4" placeholder="Password" required>
<button type="submit" id="login-btn" class="btn-primary">Sign In</button>
</form>

<div class="text-center mt-4">
<span class="text-sm text-gray-500">No account? </span>
<a href="/enter" class="text-sm text-brand-500" style="color:#007AFF">Register</a>
</div>

<div class="text-center mt-6">
<a href="/" class="text-xs text-gray-400">← Back to home</a>
</div>
</div>

<script>
function doLogin(e){
  e.preventDefault();
  var btn=document.getElementById('login-btn');
  var err=document.getElementById('error-msg');
  err.style.display='none';
  btn.disabled=true;
  btn.textContent='Signing in...';
  
  var email=document.getElementById('email').value;
  var password=document.getElementById('password').value;
  
  fetch('/auth/login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:email,password:password})
  })
  .then(function(r){return r.json().catch(function(){return{error:'Server error'};});})
  .then(function(data){
    if(data.error){
      err.textContent=data.error;
      err.style.display='block';
      btn.disabled=false;
      btn.textContent='Sign In';
      return;
    }
    if(data.ok&&data.token){
      localStorage.setItem('evolvixos_user',JSON.stringify({
        email:email,
        token:data.token,
        display_name:(data.user&&data.user.display_name)||email.split('@')[0],
        user_id:data.user&&data.user.id
      }));
      window.location.href='/platform';
    }else{
      err.textContent='Unexpected response';
      err.style.display='block';
      btn.disabled=false;
      btn.textContent='Sign In';
    }
  })
  .catch(function(){
    err.textContent='Network error';
    err.style.display='block';
    btn.disabled=false;
    btn.textContent='Sign In';
  });
  return false;
}
</script>
</body>
</html>
