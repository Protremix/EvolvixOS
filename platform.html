<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvolvixOS Platform — Build Apps with AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
.mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-[#0a0a0f] text-gray-100 min-h-screen">

<!-- Header -->
<header class="border-b border-gray-800 bg-[#0f0f15] sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center font-bold text-sm">E</div>
      <h1 class="text-lg font-semibold">EvolvixOS Platform</h1>
      <span class="text-xs text-purple-400 bg-purple-500/10 px-2 py-0.5 rounded">v1.0</span>
    </div>
    <div class="flex items-center gap-4 text-sm text-gray-400">
      <a href="/platform/" class="hover:text-white">Entities</a>
      <a href="/platform/functions" class="hover:text-white">Functions</a>
      <a href="/platform/workflows" class="hover:text-white">Workflows</a>
      <a href="/platform/chat" class="text-purple-400 hover:text-purple-300">AI Builder</a>
    </div>
  </div>
</header>

<!-- Main content -->
<div class="max-w-7xl mx-auto px-4 py-8">

  <!-- AI Chat Builder -->
  <section id="chat-section" class="mb-8">
    <h2 class="text-2xl font-bold mb-2">Build with AI</h2>
    <p class="text-gray-400 mb-4">Describe what you want to build — AI creates entities, functions, and workflows automatically.</p>
    <div class="bg-[#0f0f15] border border-gray-800 rounded-xl p-4">
      <div class="flex gap-2">
        <input id="chat-input" type="text" placeholder="e.g. Create a Task entity with title, status, and priority" 
          class="flex-1 bg-[#0a0a0f] border border-gray-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-purple-500">
        <button onclick="sendChat()" class="bg-gradient-to-r from-purple-600 to-pink-600 px-6 py-3 rounded-lg font-medium text-sm hover:opacity-90">Build</button>
      </div>
      <div id="chat-response" class="mt-4 text-sm"></div>
    </div>
  </section>

  <!-- Entities grid -->
  <section>
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-2xl font-bold">Entities</h2>
      <button onclick="loadEntities()" class="text-sm text-purple-400 hover:text-purple-300">↻ Refresh</button>
    </div>
    <div id="entities-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </section>

  <!-- Records -->
  <section id="records-section" class="mt-8 hidden">
    <div class="flex items-center justify-between mb-4">
      <h2 id="records-title" class="text-2xl font-bold"></h2>
      <button id="back-btn" onclick="showEntities()" class="text-sm text-gray-400 hover:text-white">← Back</button>
    </div>
    <div id="records-table" class="bg-[#0f0f15] border border-gray-800 rounded-xl overflow-hidden"></div>
  </section>
</div>

<script>
const API = '/platform/api';

async function sendChat() {
  const input = document.getElementById('chat-input');
  const response = document.getElementById('chat-response');
  const msg = input.value.trim();
  if (!msg) return;
  
  response.innerHTML = '<p class="text-gray-500">Thinking...</p>';
  input.value = '';
  
  try {
    const res = await fetch(API + '/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg})
    });
    const data = await res.json();
    
    let html = '<div class="bg-[#0a0a0f] border border-gray-800 rounded-lg p-3">';
    if (data.message) html += '<p class="text-green-400 mb-2">' + data.message + '</p>';
    if (data.action) html += '<p class="text-xs text-gray-500 mono">Action: ' + data.action + '</p>';
    if (data.result) html += '<pre class="text-xs text-gray-400 mt-2 mono">' + JSON.stringify(data.result, null, 2) + '</pre>';
    html += '</div>';
    response.innerHTML = html;
    
    loadEntities();
  } catch(e) {
    response.innerHTML = '<p class="text-red-400">Error: ' + e.message + '</p>';
  }
}

async function loadEntities() {
  try {
    const res = await fetch(API + '/entities');
    const data = await res.json();
    const grid = document.getElementById('entities-grid');
    
    if (!data.entities || data.entities.length === 0) {
      grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8">No entities yet. Use AI Builder above to create one.</p>';
      return;
    }
    
    grid.innerHTML = data.entities.map(e => {
      const fields = Object.keys(e.schema?.properties || {});
      return `
        <div class="bg-[#0f0f15] border border-gray-800 rounded-xl p-4 cursor-pointer hover:border-purple-500 transition-colors" onclick="viewRecords('${e.name}')">
          <h3 class="font-semibold text-lg mb-2">${e.name}</h3>
          <div class="flex flex-wrap gap-1 mb-3">
            ${fields.map(f => '<span class="text-xs bg-gray-800 text-gray-300 px-2 py-1 rounded">' + f + '</span>').join('')}
          </div>
          <p class="text-xs text-gray-500">' + fields.length + ' fields</p>
        </div>
      `;
    }).join('');
  } catch(e) {
    document.getElementById('entities-grid').innerHTML = '<p class="text-red-400">Error loading entities: ' + e.message + '</p>';
  }
}

async function viewRecords(name) {
  document.getElementById('entities-grid').parentElement.classList.add('hidden');
  document.getElementById('records-section').classList.remove('hidden');
  document.getElementById('records-title').textContent = name + ' Records';
  
  try {
    const res = await fetch(API + '/entities/' + name + '/records');
    const data = await res.json();
    const table = document.getElementById('records-table');
    
    if (!data.records || data.records.length === 0) {
      table.innerHTML = '<p class="text-gray-500 text-center py-8">No records yet.</p>';
      return;
    }
    
    const cols = Object.keys(data.records[0]);
    let html = '<table class="w-full text-sm"><thead><tr class="border-b border-gray-800">';
    cols.forEach(c => html += '<th class="text-left px-4 py-3 text-gray-400 font-medium">' + c + '</th>');
    html += '</tr></thead><tbody>';
    data.records.forEach(r => {
      html += '<tr class="border-b border-gray-800/50 hover:bg-gray-900/30">';
      cols.forEach(c => {
        let val = r[c];
        if (typeof val === 'object') val = JSON.stringify(val);
        if (val === null) val = '<span class="text-gray-600">null</span>';
        html += '<td class="px-4 py-3">' + val + '</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    table.innerHTML = html;
  } catch(e) {
    document.getElementById('records-table').innerHTML = '<p class="text-red-400 p-4">Error: ' + e.message + '</p>';
  }
}

function showEntities() {
  document.getElementById('records-section').classList.add('hidden');
  document.getElementById('entities-grid').parentElement.classList.remove('hidden');
}

// Load on start
loadEntities();
</script>
</body>
</html>
