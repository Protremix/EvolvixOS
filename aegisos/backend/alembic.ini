# AegisOS Alembic Configuration File

[alembic]
# path to migration scripts
script_location = app/migrations

# template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters in 'slug' field
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a corresponding .py file
# sourceless = false

# version location specification
# version_locations = %(here)s/bar:%(here)s/bat:app/migrations/versions

# version path separator
# version_path_separator = :

# sqlalchemy.url is loaded from DATABASE_URL environment variable in env.py,
# but a default connection string is provided here for fallback.
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/aegisos

[post_write_hooks]

[logging]
default_handler = console

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
