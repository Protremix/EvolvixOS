version: "3.9"

services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: evolvixos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - evolvixos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d evolvixos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for task queue and event bus
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - evolvixos-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # EvolvixOS API server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://aegis:aegis@postgres:5432/evolvixos
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY_2=${OPENAI_API_KEY_2}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evolvixos-net
    restart: unless-stopped

  # Worker 1
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - WORKER_ID=worker-1
      - WORKER_MAX_TASKS=4
      - WORKER_HEALTH_PORT=8001
      - DATABASE_URL=postgresql+psycopg2://aegis:aegis@postgres:5432/evolvixos
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY_2=${OPENAI_API_KEY_2}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evolvixos-net
    restart: unless-stopped

  # Worker 2
  worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - WORKER_ID=worker-2
      - WORKER_MAX_TASKS=4
      - WORKER_HEALTH_PORT=8001
      - DATABASE_URL=postgresql+psycopg2://aegis:aegis@postgres:5432/evolvixos
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY_2=${OPENAI_API_KEY_2}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evolvixos-net
    restart: unless-stopped

  # Worker 3
  worker-3:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - WORKER_ID=worker-3
      - WORKER_MAX_TASKS=4
      - WORKER_HEALTH_PORT=8001
      - DATABASE_URL=postgresql+psycopg2://aegis:aegis@postgres:5432/evolvixos
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY_2=${OPENAI_API_KEY_2}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evolvixos-net
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - evolvixos-net
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  evolvixos-net:
    driver: bridge
