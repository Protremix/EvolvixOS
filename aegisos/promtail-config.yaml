server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://evolvixos-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    pipeline_stages:
      - docker:
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: container_name
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream

  - job_name: journal
    journal:
      path: /var/log/journal
      labels:
        job: systemd-journal
    relabel_configs:
      - source_labels: ["__journal__systemd_unit"]
        target_label: unit

  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          __path__: /var/log/nginx/*access*.log

  - job_name: backups
    static_configs:
      - targets: [localhost]
        labels:
          job: backup
          __path__: /opt/backups/logs/*.log
