global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "aegisos-backend"
    static_configs:
      - targets: ["aegisos-backend:8000"]
    metrics_path: /metrics
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: 'evolvixos-monitoring'
    static_configs:
      - targets: ['localhost:3700']
    metrics_path: /metrics
    scrape_interval: 15s
