<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EvolvixOS">
    <meta name="theme-color" content="#0a0e14">
    <meta name="mobile-web-app-capable" content="yes">
    <title>EvolvixOS</title>
    <style>
        :root {
            --bg: #0a0e14;
            --card: #131820;
            --card2: #1a2030;
            --border: #2a3142;
            --purple: #7c5cff;
            --teal: #00d4aa;
            --text: #e4e7ec;
            --text2: #8b9099;
            --green: #00d4aa;
            --red: #f07178;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; min-height: 100dvh;
            overscroll-behavior: none;
        }

        /* HEADER */
        .header {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px; background: var(--card);
            border-bottom: 1px solid var(--border);
            padding-top: max(14px, env(safe-area-inset-top));
        }
        .logo { font-size: 20px; font-weight: 800; }
        .logo .a { color: var(--purple); }
        .logo .b { color: var(--teal); }
        .status-pill {
            display: flex; align-items: center; gap: 6px;
            background: rgba(0,212,170,0.15); padding: 5px 12px;
            border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--teal);
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
        .status-dot.offline { background: var(--red); }

        /* CHAT AREA */
        .chat {
            display: flex; flex-direction: column;
            height: calc(100dvh - 70px - 76px);
            padding: 16px; overflow-y: auto;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .msg { max-width: 82%; margin-bottom: 10px; padding: 14px 18px; border-radius: 20px; font-size: 16px; line-height: 1.5; }
        .msg.user { background: var(--purple); color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; }
        .msg.ai { background: var(--card); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 6px; }
        .msg.system { background: var(--card2); color: var(--text2); font-size: 13px; align-self: center; padding: 8px 16px; }

        /* TYPING */
        .typing { display: flex; gap: 5px; padding: 4px 0; }
        .typing span { width: 8px; height: 8px; background: var(--text2); border-radius: 50%; animation: bounce 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }

        /* INPUT BAR */
        .input-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            display: flex; align-items: center; gap: 10px;
            padding: 14px 20px; background: var(--card);
            border-top: 1px solid var(--border);
            padding-bottom: max(14px, env(safe-area-inset-bottom));
        }
        .input {
            flex: 1; background: var(--card2); border: 1px solid var(--border);
            color: var(--text); padding: 14px 20px; border-radius: 24px;
            font-size: 16px; outline: none; transition: 0.2s;
        }
        .input:focus { border-color: var(--purple); }
        .input::placeholder { color: var(--text2); }

        .mic-btn, .send-btn {
            width: 48px; height: 48px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; flex-shrink: 0;
        }
        .mic-btn { background: var(--card2); font-size: 22px; }
        .mic-btn.recording { background: var(--red); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .send-btn { background: var(--purple); color: #fff; font-size: 22px; }
        .send-btn:disabled { opacity: 0.4; }

        /* VOICE WAVE */
        .wave { display: flex; align-items: center; gap: 3px; height: 24px; }
        .wave span { width: 3px; background: #fff; border-radius: 2px; animation: wv 0.8s infinite ease-in-out; }
        .wave span:nth-child(1) { height: 12px; animation-delay: 0s; }
        .wave span:nth-child(2) { height: 20px; animation-delay: 0.1s; }
        .wave span:nth-child(3) { height: 24px; animation-delay: 0.2s; }
        .wave span:nth-child(4) { height: 16px; animation-delay: 0.3s; }
        .wave span:nth-child(5) { height: 20px; animation-delay: 0.4s; }
        @keyframes wv { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }

        /* WELCOME CARD */
        .welcome {
            text-align: center; padding: 40px 20px;
        }
        .welcome h2 {
            font-size: 24px; font-weight: 700; margin-bottom: 12px;
            background: linear-gradient(135deg, var(--purple), var(--teal));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .welcome p { color: var(--text2); font-size: 15px; line-height: 1.6; max-width: 300px; margin: 0 auto 24px; }
        .welcome-features { display: flex; flex-direction: column; gap: 10px; text-align: left; max-width: 280px; margin: 0 auto; }
        .welcome-feature { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--text2); }
        .welcome-feature span { font-size: 22px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo"><span class="a">Evolvix</span><span class="b">OS</span></div>
        <div class="status-pill">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">Free · $0.00</span>
        </div>
    </div>

    <div class="chat" id="chat">
        <div class="welcome" id="welcome">
            <h2>Your AI Assistant</h2>
            <p>I run on your server. No cloud, no cost, no limits. Tap the mic to talk or type below.</p>
            <div class="welcome-features">
                <div class="welcome-feature"><span>💬</span> Chat about anything</div>
                <div class="welcome-feature"><span>🎤</span> Talk with your voice</div>
                <div class="welcome-feature"><span>🔒</span> 100% private</div>
                <div class="welcome-feature"><span>💰</span> Always free</div>
            </div>
        </div>
    </div>

    <div class="input-bar">
        <button class="mic-btn" id="mic-btn" onclick="toggleRecording()">🎤</button>
        <input class="input" id="text-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button class="send-btn" id="send-btn" onclick="sendMessage()">↑</button>
    </div>

    <script>
        const HOST = window.location.hostname || 'localhost';
        const API = `http://${HOST}:5001/api/v1`;
        let ws = null;
        let recording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let connected = false;

        // Try WebSocket
        function connectWS() {
            try {
                ws = new WebSocket(`ws://${HOST}:5002/chat`);
                ws.onopen = () => {
                    connected = true;
                    document.getElementById('status-dot').classList.remove('offline');
                    document.getElementById('status-text').textContent = 'Connected · $0.00';
                };
                ws.onmessage = (e) => {
                    const data = JSON.parse(e.data);
                    removeTyping();
                    if (data.type === 'response' || data.type === 'chat_response') {
                        addMsg(data.message || data.result, 'ai');
                    } else if (data.type === 'transcription') {
                        addMsg(data.text, 'user');
                    } else if (data.type === 'voice_response' && data.audio) {
                        new Audio('data:audio/wav;base64,' + data.audio).play();
                    }
                };
                ws.onclose = () => {
                    connected = false;
                    document.getElementById('status-dot').classList.add('offline');
                    document.getElementById('status-text').textContent = 'REST mode · $0.00';
                    setTimeout(connectWS, 5000);
                };
                ws.onerror = () => {
                    document.getElementById('status-dot').classList.add('offline');
                    document.getElementById('status-text').textContent = 'REST mode · $0.00';
                };
            } catch(e) {
                console.log('WS failed');
            }
        }

        function addMsg(text, sender) {
            // Remove welcome on first message
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.remove();

            const chat = document.getElementById('chat');
            const msg = document.createElement('div');
            msg.className = `msg ${sender}`;
            msg.textContent = text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        function showTyping(text) {
            removeTyping();
            const chat = document.getElementById('chat');
            const msg = document.createElement('div');
            msg.className = 'msg ai';
            msg.id = 'typing';
            if (text) {
                msg.innerHTML = `<span style="color:var(--text2)">${text}</span>`;
            } else {
                msg.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            }
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeTyping() {
            const t = document.getElementById('typing');
            if (t) t.remove();
        }

        function sendMessage() {
            const input = document.getElementById('text-input');
            const text = input.value.trim();
            if (!text) return;

            addMsg(text, 'user');
            input.value = '';
            showTyping();

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({type: 'text', message: text, speak: false}));
            } else {
                // REST fallback
                fetch(`${API}/chat`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                }).then(r => r.json()).then(data => {
                    removeTyping();
                    addMsg(data.response || data.error || 'No response', 'ai');
                }).catch(() => {
                    removeTyping();
                    addMsg('Cannot reach EvolvixOS. The server may still be starting up.', 'system');
                });
            }
        }

        async function toggleRecording() {
            const btn = document.getElementById('mic-btn');
            if (!recording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, {type: 'audio/wav'});
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const b64 = reader.result.split(',')[1];
                            if (ws && ws.readyState === WebSocket.OPEN) {
                                showTyping('🎤 Transcribing...');
                                ws.send(JSON.stringify({type: 'voice', audio: b64}));
                            } else {
                                addMsg('Voice needs the WebSocket server. Text chat works fine!', 'system');
                            }
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start();
                    recording = true;
                    btn.classList.add('recording');
                    btn.innerHTML = '<div class="wave"><span></span><span></span><span></span><span></span><span></span></div>';
                } catch(e) {
                    addMsg('Please allow microphone access to use voice.', 'system');
                }
            } else {
                mediaRecorder.stop();
                recording = false;
                btn.classList.remove('recording');
                btn.textContent = '🎤';
            }
        }

        // Connect
        connectWS();

        // Register device
        fetch(`${API}/devices/register`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name: navigator.platform || 'Web Client',
                type: /Android|iPhone|iPad|iPod/.test(navigator.userAgent) ? 'mobile' : 'desktop',
                os: navigator.platform,
                capabilities: ['text', 'voice']
            })
        }).catch(() => {});
    </script>
</body>
</html>
