name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << "EOF"
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Pull latest code
            git fetch origin main
            git reset --hard origin/main
            
            # Restart services
            systemctl restart evolvix-dashboard || true
            systemctl restart evolvix-telegram || true
            systemctl reload nginx || true
            
            # Health check
            sleep 3
            curl -sf http://localhost:5005/api/health > /dev/null && echo "Dashboard: OK" || echo "Dashboard: WARNING"
            
            echo "Deploy complete: $(date)"
          EOF

      - name: Verify deployment
        run: |
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://evolvixos.com/dashboard)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Production is live (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Production check returned HTTP $HTTP_CODE"
            exit 1
          fi
