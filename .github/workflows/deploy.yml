name: Deploy to Server

on:
  push:
    branches: [main]
    paths:
      - 'models/**'
      - 'auth/**'
      - 'agent/**'
      - 'dashboard/**'
      - 'learner/**'
      - 'knowledge/**'
      - 'tccli/**'
      - 'skills/**'
      - 'memory/**'

jobs:
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Sync to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/evolvixos
            git pull origin main
            echo "Deployed at $(date)"
            
            # Restart core services
            systemctl restart evolvix-model-api 2>/dev/null || true
            systemctl restart evolvix-auth-api 2>/dev/null || true
            systemctl restart evolvix-dashboard 2>/dev/null || true
            
            echo "Services restarted"
