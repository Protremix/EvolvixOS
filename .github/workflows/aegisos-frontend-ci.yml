name: AegisOS Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "aegisos/frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "aegisos/frontend/**"

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: aegisos/frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd aegisos/frontend
          npm ci || npm install
      - name: Build
        run: |
          cd aegisos/frontend
          npm run build
      - name: Build summary
        if: always()
        run: |
          echo "## Frontend Build" >> $GITHUB_STEP_SUMMARY
          echo "Build completed successfully" >> $GITHUB_STEP_SUMMARY
