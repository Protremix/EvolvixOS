# EvolvixOS — Nginx Configuration for evolvixos.com
# Routes traffic to API server, Web UI, and serves the landing page

events {
    worker_connections 1024;
}

http {
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    
    # Upstream services
    upstream evolvix_api {
        server evolvix:5001;
    }
    
    upstream evolvix_web {
        server evolvix:5000;
    }
    
    upstream ollama_api {
        server ollama:11434;
    }
    
    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 256;
    
    # Main site — evolvixos.com
    server {
        listen 80;
        server_name evolvixos.com www.evolvixos.com;
        
        # Redirect to HTTPS (uncomment when SSL is set up)
        # return 301 https://$host$request_uri;
        
        # Landing page (static)
        root /var/www/evolvixos.com;
        index index.html;
        
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # API — /api/* goes to EvolvixOS API server
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://evolvix_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 100M;
        }
        
        # Web UI — /app/* goes to EvolvixOS Web UI
        location /app/ {
            proxy_pass http://evolvix_web/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # Ollama API (internal — restrict to localhost)
        location /ollama/ {
            # allow 127.0.0.1;
            # deny all;
            proxy_pass http://ollama_api/;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
        }
        
        # Health check endpoint
        location /health {
            proxy_pass http://evolvix_api/api/v1/health;
            access_log off;
        }
        
        # Status endpoint (public)
        location /status {
            proxy_pass http://evolvix_api/api/v1/status;
            access_log off;
        }
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    
    # HTTPS server (uncomment when SSL certs are ready)
    # server {
    #     listen 443 ssl http2;
    #     server_name evolvixos.com www.evolvixos.com;
    #     
    #     ssl_certificate /etc/nginx/certs/evolvixos.com.pem;
    #     ssl_certificate_key /etc/nginx/certs/evolvixos.com.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
