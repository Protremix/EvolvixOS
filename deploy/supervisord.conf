# EvolvixOS — Supervisor Configuration
# Manages all EvolvixOS processes in production

[supervisord]
nodaemon=true
user=root
logfile=/opt/evolvixos/logs/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# === Ollama LLM Engine ===
[program:ollama]
command=ollama serve
autostart=true
autorestart=true
stdout_logfile=/opt/evolvixos/logs/ollama.log
stderr_logfile=/opt/evolvixos/logs/ollama_err.log
priority=1

# === Auto-pull models on startup ===
[program:ollama-models]
command=sh -c "sleep 10 && ollama pull deepseek-r1:7b && ollama pull qwen2.5-coder:7b && ollama pull llama3.2:3b"
autostart=true
autorestart=false
stdout_logfile=/opt/evolvixos/logs/ollama_models.log
stderr_logfile=/opt/evolvixos/logs/ollama_models_err.log
priority=2

# === EvolvixOS API Server ===
[program:evolvix-api]
directory=/opt/evolvixos
command=python3 api_server.py --host 0.0.0.0 --port 5001
autostart=true
autorestart=true
stdout_logfile=/opt/evolvixos/logs/api.log
stderr_logfile=/opt/evolvixos/logs/api_err.log
priority=3
environment=OLLAMA_HOST="http://localhost:11434",EVOLVIX_ENV="production"

# === EvolvixOS Web UI ===
[program:evolvix-web]
directory=/opt/evolvixos
command=python3 -c "from web_ui import app; app.run(host='0.0.0.0', port=5000)"
autostart=true
autorestart=true
stdout_logfile=/opt/evolvixos/logs/web.log
stderr_logfile=/opt/evolvixos/logs/web_err.log
priority=4
environment=OLLAMA_HOST="http://localhost:11434"

# === Auto-Learner (GitHub Discovery Engine — continuous) ===
[program:evolvix-learner]
directory=/opt/evolvixos
command=python3 -c "
import time, sys
sys.path.insert(0, '.')
from skills.github_discovery.skill import Skill as Discovery
d = Discovery()
while True:
    print('🧬 Auto-learning cycle starting...')
    try:
        d.run({'action': 'discover', 'auto_learn': True, 'limit': 20})
        print('✅ Learning cycle complete. Sleeping 24h...')
    except Exception as e:
        print(f'⚠ Learning error: {e}')
    time.sleep(86400)
"
autostart=true
autorestart=true
stdout_logfile=/opt/evolvixos/logs/learner.log
stderr_logfile=/opt/evolvixos/logs/learner_err.log
priority=5

# === Nginx Reverse Proxy ===
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/opt/evolvixos/logs/nginx.log
stderr_logfile=/opt/evolvixos/logs/nginx_err.log
priority=10
